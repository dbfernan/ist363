<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container container-fluid px-5">
            <a class="navbar-brand" href="#">
                <img src="images/logo.png" alt="Logo" width="60" height="40" class="d-inline-block align-text-top">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarText">
                <div class="ms-auto">
                    <span class="navbar-text">
                        About   
                    </span>
                    <span class="navbar-text">
                        Portfolio   
                    </span>
                    <span class="navbar-text">
                        Shop    
                    </span>
                    <span class="navbar-text">
                        Contact
                    </span>
                </div>
            </div>
        </div>
    </nav>
    <div class="container text-center p-5">
        <h2>Portfolio</h2>
        <div class="row mt-4">
            <div class="col-sm-3">
                <img src="images/architecture.jpg" class="img-fluid w-100 mb-3" alt="Architecture">
                <img src="images/blue-eryngo.jpg" class="img-fluid w-100 mb-3" alt="Blue Eryngo">
            </div>
            <div class="col-sm-3">
                <img src="images/art.jpg" class="img-fluid w-100 mb-3" alt="Art">
                <img src="images/blue-flower.jpg" class="img-fluid w-100 mb-3" alt="Blue Flower">
            </div>
            <div class="col-sm-6">
                <img src="images/clouds.jpg" class="img-fluid w-100 mb-3" alt="Clouds">
            </div>
        </div>
        <div class="row mb-4">
            <div class="col-sm-3">
                <img src="images/lake.jpg" class="img-fluid w-100 mb-3" alt="Lake">
            </div>
            <div class="col-sm-3">
                <img src="images/mountains.jpg" class="img-fluid w-100 mb-3" alt="Mountains">
            </div>
            <div class="col-sm-3">
                <img src="images/plum.jpg" class="img-fluid w-100 mb-3" alt="Plum">
            </div>
            <div class="col-sm-3">
                <img src="images/snow.jpg" class="img-fluid w-100 mb-3" alt="Snow">
            </div>
        </div>
        <button class="btn btn-primary" type="submit">See More</button>
    </div>
    <div class="text-center bg-light p-5">
        <h2>About the Artist</h2>
        <p>Capturing moments through the lens, my passion is bringing moments to life in every frame.</p>
        <button class="btn btn-outline-dark" type="submit">Read More</button>
    </div>
</body>
</html>
