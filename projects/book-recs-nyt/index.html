<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommendations NYT</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Algreya:ital,wght@0,300..900;1,300..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="red darken-4">
        <div class="nav-wrapper container">
        <a href="#" class="brand-logo">NYT Books</a>
        <ul id="nav-mobile" class="right hide-on-med-and-down">
            <li><a href="#">Home</a></li>
            <li><a href="#">Best Sellers</a></li>
        </ul>
        </div>
    </nav>

    <div class="parallax-container">
        <div class="parallax">
            <img src="images/hero.jpg" alt="Bookshelf">
        </div>

        <div class="hero-content center-align white-text">
            <h1>Explore Books From Our Library</h1>
            <h6>Updated in real time via the New York Times API</h6>
        </div>
    </div>

    <main class="container">
        <h4 class="center-align">Best Seller Recommendations</h4>
        <div id="books-container" class="row"></div>
        <div id="error-message" class="red-text center-align"></div>
    </main>

    <footer class="page-footer red darken-4">
        <div class="container center-align">
            <span>© 2026 New York Times Book Recommendations</span>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
