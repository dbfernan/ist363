<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DF Digital Book Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;900&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        h1,h2,h3,h4,h5 { font-family: 'Alegreya', serif; }
        body, p, a, label, button, span { font-family: 'Merriweather', serif; }

        .parallax-hero { position: relative; height: 420px; overflow: hidden; }
        .parallax-hero img { position: absolute; width: 100%; height: 140%; object-fit: cover; }
        .parallax-hero .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.52); }
        .parallax-hero .hero-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }

        .book-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .book-card:hover { transform: scale(1.05); box-shadow: 0 12px 32px rgba(0,0,0,0.15); }
        #search-btn { transition: transform 0.2s ease; }
        #search-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body class="flex flex-col min-h-screen bg-stone-50">

    <nav class="bg-red-900/80 backdrop-blur-md sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
            <a href="#" class="text-white text-2xl font-bold" style="font-family:'Alegreya',serif">DF Books</a>
            <ul class="hidden md:flex gap-6 text-sm text-red-200">
                <li><a href="#home-section"         class="hover:text-white">Home</a></li>
                <li><a href="#search-section"       class="hover:text-white">Search</a></li>
                <li><a href="#best-sellers-section" class="hover:text-white">Best Sellers</a></li>
                <li><a href="my-books.html" class="hover:text-white flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M5 3a2 2 0 0 0-2 2v16l9-4 9 4V5a2 2 0 0 0-2-2H5z"/></svg>
                    My Books
                </a></li>
            </ul>
        </div>
    </nav>

    <div id="home-section" class="parallax-hero">
        <img id="parallax-img" src="images/hero.jpg" alt="Bookshelf">
        <div class="overlay"></div>
        <div class="hero-content text-center px-4">
            <h1 class="text-white text-4xl md:text-5xl font-bold drop-shadow-lg mb-3">Discover New Books From Our Library</h1>
            <p class="text-red-200 text-sm md:text-base">Updated in real time via the Open Library &amp; New York Times API</p>
        </div>
    </div>

    <section id="search-section" class="max-w-5xl mx-auto w-full px-4 mt-14">
        <h4 class="text-3xl font-bold text-center text-red-900 mb-8">Book Search</h4>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div>
                <label for="title-input"  class="block text-xs font-semibold text-stone-500 uppercase tracking-widest mb-1">Title</label>
                <input id="title-input"  type="text" class="w-full border border-stone-300 rounded-lg px-4 py-2.5 text-sm bg-white focus:outline-none focus:border-red-800 focus:ring-2 focus:ring-red-100">
            </div>
            <div>
                <label for="author-input" class="block text-xs font-semibold text-stone-500 uppercase tracking-widest mb-1">Author</label>
                <input id="author-input" type="text" class="w-full border border-stone-300 rounded-lg px-4 py-2.5 text-sm bg-white focus:outline-none focus:border-red-800 focus:ring-2 focus:ring-red-100">
            </div>
            <div>
                <label for="genre-input"  class="block text-xs font-semibold text-stone-500 uppercase tracking-widest mb-1">Genre</label>
                <input id="genre-input"  type="text" class="w-full border border-stone-300 rounded-lg px-4 py-2.5 text-sm bg-white focus:outline-none focus:border-red-800 focus:ring-2 focus:ring-red-100">
            </div>
        </div>
        <div class="flex justify-center mb-2">
            <button id="search-btn" class="bg-red-900 hover:bg-red-800 text-white font-semibold px-10 py-2.5 rounded-lg shadow">Search</button>
        </div>
        <p id="error-message" class="text-center text-red-600 text-sm min-h-[1.5rem]"></p>
    </section>

    <section class="max-w-6xl mx-auto w-full px-4 mb-12">
        <div id="search-results-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"></div>
    </section>

    <main id="best-sellers-section" class="max-w-6xl mx-auto w-full px-4 mb-16">
        <h4 class="text-3xl font-bold text-center text-red-900 mb-8">NYT Best Sellers</h4>
        <div id="books-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <footer class="mt-auto bg-red-900/80 backdrop-blur-md text-red-200 text-center text-sm py-5">
        © 2026 DF Digital Book Library
    </footer>

    <script src="script.js"></script>
</body>
</html>
