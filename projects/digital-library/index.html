<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DF Digital Book Library</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Algreya:ital,wght@0,300..900;1,300..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="red darken-4">
        <div class="nav-wrapper container">
            <a href="#" class="brand-logo">DF Books</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="#home-section">Home</a></li>
                <li><a href="#search-section">Search</a></li>
                <li><a href="#best-sellers-section">Best Sellers</a></li>
            </ul>
        </div>
    </nav>

    <div id="home-section" class="parallax-container">
        <div class="parallax">
            <img src="images/hero.jpg" alt="Bookshelf">
        </div>
        <div class="hero-content center-align white-text">
            <h1>Discover New Books From Our Library</h1>
            <h6>Updated in real time via the Open Library & New York Times API</h6>
        </div>
    </div>

    <h4 class="center-align" style="margin-top: 50px;">Book Search</h4>

    <div id="search-section" class="row">
        <div class="input-field col s12 m4">
            <input id="title-input" type="text">
            <label for="title-input">Title</label>
        </div>
        <div class="input-field col s12 m4">
            <input id="author-input" type="text">
            <label for="author-input">Author</label>
        </div>
        <div class="input-field col s12 m4">
            <input id="genre-input" type="text">
            <label for="genre-input">Genre</label>
        </div>
    </div>

    <div class="row">
        <div class="col s12 center-align">
            <button id="search-btn" class="btn red darken-4">Search</button>
        </div>
    </div>

    <div class="row">
        <div class="col s12 center-align">
            <p id="error-message" class="red-text"></p>
        </div>
    </div>

    <div class="row container">
        <div id="search-results-container" class="row"></div>
    </div>

    <main id="best-sellers-section" class="container">
        <h4 class="center-align">NYT Best Sellers</h4>
        <div id="books-container" class="row"></div>
    </main>

    <footer class="page-footer red darken-4">
        <div class="container center-align">
            <span>© 2026 DF Digital Book Library</span>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
